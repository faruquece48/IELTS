name: Collect AQI readings

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected AQI collector
        env:
          AQI_CRON_URL: ${{ secrets.AQI_CRON_URL }}
          AQI_CRON_SECRET: ${{ secrets.AQI_CRON_SECRET }}
        run: |
          if [ -z "$AQI_CRON_URL" ] || [ -z "$AQI_CRON_SECRET" ]; then
            echo "AQI_CRON_URL and AQI_CRON_SECRET must be configured as repository secrets."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            --header "Authorization: Bearer $AQI_CRON_SECRET" \
            "$AQI_CRON_URL"
