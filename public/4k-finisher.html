<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4K JPG Finisher</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #222;
  }
  .container {
    max-width: 900px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 30px rgba(0,0,0,.08);
  }
  h1 { margin-top: 0; font-size: 24px; }
  p.sub { color: #666; margin-top: -8px; }
  label { display: block; margin-top: 18px; margin-bottom: 7px; font-weight: bold; }
  select, input[type="range"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 7px; font-size: 15px; }
  .drop {
    margin-top: 18px;
    border: 2px dashed #b7c3d4;
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    color: #666;
    cursor: pointer;
    background: #fafbfc;
  }
  .drop.drag { background: #eef4ff; border-color: #1266f1; }
  button {
    border: 0; border-radius: 7px; padding: 13px 20px;
    margin-top: 18px; margin-right: 8px; font-size: 15px; cursor: pointer;
  }
  #downloadBtn { background: #159447; color: white; }
  #downloadBtn:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 18px; padding: 14px; background: #f5f5f5; border-radius: 8px; line-height: 1.6; font-size: 14px; }
  .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  .preview-box { border: 1px solid #ddd; border-radius: 10px; padding: 10px; }
  .preview-box img { width: 100%; display: block; border-radius: 6px; background: #eee; max-height: 320px; object-fit: contain; }
  .quality-row { display: flex; align-items: center; gap: 12px; }
  .quality-val { min-width: 42px; text-align: right; font-weight: bold; }
  @media(max-width:700px) { .preview-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>4K JPG Finisher</h1>
  <p class="sub">Fits/crops any image (e.g. output from an AI upscaler) into exact 4K dimensions and exports a high-quality JPG.</p>

  <label>Image</label>
  <div class="drop" id="drop">Click to choose a file, or drag & drop an image here</div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <label>Output mode</label>
  <select id="mode">
    <option value="fit">4K — Fit inside 3840 × 2160 (preserves ratio, no cropping)</option>
    <option value="crop">4K — Exact 3840 × 2160 (center-cropped)</option>
    <option value="native">Keep native resolution, just re-export as JPG</option>
  </select>

  <label>JPEG quality</label>
  <div class="quality-row">
    <input type="range" id="quality" min="70" max="100" value="98">
    <span class="quality-val" id="qualityVal">98%</span>
  </div>

  <button id="downloadBtn" disabled>⬇ Download JPG</button>

  <div id="status">Ready. Choose an image to begin.</div>

  <div class="preview-grid">
    <div class="preview-box"><h3 style="margin:4px 0;font-size:14px;">Original</h3><img id="originalPreview"></div>
    <div class="preview-box"><h3 style="margin:4px 0;font-size:14px;">Result</h3><img id="resultPreview"></div>
  </div>
</div>

<script>
let finalBlob = null;

const statusEl = document.getElementById('status');
const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const modeEl = document.getElementById('mode');
const qualityEl = document.getElementById('quality');
const qualityValEl = document.getElementById('qualityVal');
const downloadBtn = document.getElementById('downloadBtn');
const originalPreview = document.getElementById('originalPreview');
const resultPreview = document.getElementById('resultPreview');

qualityEl.addEventListener('input', () => {
  qualityValEl.textContent = qualityEl.value + '%';
  if (originalPreview.src) process();
});
modeEl.addEventListener('change', () => { if (originalPreview.src) process(); });

dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

let currentImage = null;

function loadFile(file) {
  if (!file.type.startsWith('image/')) {
    statusEl.textContent = 'Please choose an image file.';
    return;
  }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    originalPreview.src = url;
    statusEl.textContent = `Loaded: ${img.naturalWidth} × ${img.naturalHeight}px`;
    process();
  };
  img.onerror = () => { statusEl.textContent = 'Could not load that image.'; };
  img.src = url;
}

function process() {
  if (!currentImage) return;
  const mode = modeEl.value;
  const quality = parseInt(qualityEl.value, 10) / 100;

  const targetW = 3840, targetH = 2160;
  const srcW = currentImage.naturalWidth, srcH = currentImage.naturalHeight;
  let canvas = document.createElement('canvas');
  let ctx;

  if (mode === 'native') {
    canvas.width = srcW;
    canvas.height = srcH;
    ctx = canvas.getContext('2d');
    ctx.drawImage(currentImage, 0, 0);
  } else if (mode === 'fit') {
    const scale = Math.min(targetW / srcW, targetH / srcH);
    canvas.width = Math.round(srcW * scale);
    canvas.height = Math.round(srcH * scale);
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
  } else { // crop
    canvas.width = targetW;
    canvas.height = targetH;
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const srcRatio = srcW / srcH;
    const targetRatio = targetW / targetH;
    let cropW, cropH;
    if (srcRatio > targetRatio) {
      cropH = srcH;
      cropW = Math.round(cropH * targetRatio);
    } else {
      cropW = srcW;
      cropH = Math.round(cropW / targetRatio);
    }
    const sx = Math.round((srcW - cropW) / 2);
    const sy = Math.round((srcH - cropH) / 2);
    ctx.drawImage(currentImage, sx, sy, cropW, cropH, 0, 0, targetW, targetH);
  }

  canvas.toBlob(blob => {
    finalBlob = blob;
    resultPreview.src = URL.createObjectURL(blob);
    const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
    statusEl.innerHTML =
      `Original: ${srcW} × ${srcH}px<br>` +
      `Result: ${canvas.width} × ${canvas.height}px<br>` +
      `JPG size: ${sizeMB} MB · Quality: ${Math.round(quality*100)}%`;
    downloadBtn.disabled = false;
  }, 'image/jpeg', quality);
}

downloadBtn.addEventListener('click', () => {
  if (!finalBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(finalBlob);
  a.download = 'image-4k.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>
</body>
</html>
